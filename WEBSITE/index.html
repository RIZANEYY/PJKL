<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <center><h1>Login</h1></center>
        <form>
            <div class="input-group">
                <input type="email" class="input-box" placeholder=" " required>
                <label>Email Address</label>
            </div>

            <div class="input-group">
                <input type="password" id="password-input" class="input-box password-box" placeholder=" " required>
                <label>Password</label>
                <!-- Toggle Password Button with SVG Eye Icon -->
                <button type="button" id="toggle-password" class="toggle-btn" aria-label="Toggle password visibility">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <button type="submit">Sign In</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
